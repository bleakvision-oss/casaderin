[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/menu"
  to = "/menu.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/menu"
  to = "/.netlify/functions/menu-get"
  status = 200

[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin/menu"
  to = "/.netlify/functions/menu-save"
  status = 200

[[redirects]]
  from = "/api/analytics/track"
  to = "/.netlify/functions/analytics-track"
  status = 200

[[redirects]]
  from = "/api/analytics/summary"
  to = "/.netlify/functions/analytics-summary"
  status = 200
