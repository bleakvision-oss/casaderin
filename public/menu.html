<!doctype html>
<html>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Casa de Rin Menu</title>
  <link rel='stylesheet' href='/styles/base.css'>
  <link rel='stylesheet' href='/styles/menu.css'>
</head>
<body>
  <header class="menu-header">
    <div class="wrap inline" style="justify-content:space-between">
      <div>
        <div class="brand">Casa de Rin</div>
        <div id="today" class="muted"></div>
      </div>
      <div class="lang">
        <button data-lang="sl" class="active" aria-label="Slovenščina"><span class="flag">🇸🇮</span><span class="code">SL</span></button>
        <button data-lang="it" aria-label="Italiano"><span class="flag">🇮🇹</span><span class="code">IT</span></button>
        <button data-lang="en" aria-label="English"><span class="flag">🇬🇧</span><span class="code">EN</span></button>
        <button data-lang="de" aria-label="Deutsch"><span class="flag">🇩🇪</span><span class="code">DE</span></button>
      </div>
    </div>
    <div class="gold-bar" aria-hidden="true"></div>
  </header>
  <main class='wrap grid' id='content'></main>
  <script type='module' src='/menu.js'></script>
</body>
</html>
